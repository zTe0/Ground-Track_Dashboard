<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Ground-Track Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛰️%3C/text%3E%3C/svg%3E" />
    <!-- Leaflet.js CSS for map styling -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Reset and full-height flexbox layout */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; display: flex; height: 100vh; background: #1a1a2e; color: #e0e0e0; }

        /* Sidebar panel for telemetry display */
        #sidebar { width: 300px; padding: 20px; overflow-y: auto; background: #16213e; border-right: 1px solid #0f3460; }
        #sidebar h1 { font-size: 14px; margin-bottom: 16px; color: #4fc3f7; letter-spacing: 2px; }
        #sidebar h2 { font-size: 12px; margin-bottom: 8px; color: #4fc3f7; border-bottom: 1px solid #0f3460; padding-bottom: 4px; }
        #sidebar label { font-size: 11px; display: block; margin-bottom: 4px; color: #90a4ae; }
        #sidebar select, #sidebar input { width: 100%; padding: 8px; margin-bottom: 8px; background: #0f3460; color: #e0e0e0; border: 1px solid #4fc3f7; border-radius: 4px; font-family: monospace; }
        #sidebar button { width: 100%; padding: 8px; margin-bottom: 16px; background: #4fc3f7; color: #1a1a2e; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: monospace; }
        /* Data rows for orbital elements */
        .data-group { margin-bottom: 16px; }
        .data-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
        .data-row .label { color: #90a4ae; }
        .data-row .value { color: #e0e0e0; }

        /* Map fills remaining width */
        #map { flex: 1; }
        .status { font-size: 11px; margin-top: 12px; color: #66bb6a; }
        .pass-item { font-size: 11px; padding: 6px; margin-bottom: 4px; background: #0f3460; border-radius: 4px; }
        .pass-time { color: #4fc3f7; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>SATELLITE GROUND-TRACK</h1>  
        <label>SELECT SATELLITE</label>
        <select id="sat-select"></select>

        <label>OR ENTER CUSTOM NORAD ID</label>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <input type="number" id="custom-sat-input" placeholder="e.g. 48274" style="margin-bottom: 0;" />
            <button id="custom-sat-btn" style="margin-bottom: 0; width: 80px;">LOAD</button>
        </div>
        <div class="data-group">
            <h2>GEODETIC POSITION</h2>
            <div class="data-row"><span class="label">Latitude</span><span class="value" id="lat">--</span></div>
            <div class="data-row"><span class="label">Longitude</span><span class="value" id="lon">--</span></div>
            <div class="data-row"><span class="label">Altitude</span><span class="value" id="alt">--</span></div>
        </div>
        <div class="data-group">
            <h2>ORBITAL ELEMENTS</h2>
            <div class="data-row"><span class="label">Velocity</span><span class="value" id="vel">--</span></div>
            <div class="data-row"><span class="label">Inclination</span><span class="value" id="inc">--</span></div>
            <div class="data-row"><span class="label">Period</span><span class="value" id="period">--</span></div>
            <div class="data-row"><span class="label">Eccentricity</span><span class="value" id="ecc">--</span></div>
        </div>
        <div class="data-group">
            <h2>PASS PREDICTIONS</h2>
            <label>Observer Lat</label>
            <input type="number" id="obs-lat" value="40.7128" step="0.01" />
            <label>Observer Lon</label>
            <input type="number" id="obs-lon" value="-74.006" step="0.01" />
            <button id="predict-btn">PREDICT PASSES</button>
            <div id="passes-list"></div>
        </div>
        <div class="status" id="status" style="margin-bottom: 16px;">Initializing...</div>
        
        <!-- Cross-Referenced Sidebar Links -->
        <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid #0f3460; display: flex; flex-direction: column; gap: 12px;">
            
            <!-- Link to FastAPI Interactive Docs -->
            <a href="/docs#" target="_blank" style="color: #4fc3f7; text-decoration: none; font-size: 11px; display: flex; align-items: center; gap: 8px; font-weight: bold; letter-spacing: 1px;">
                <svg height="16" width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block;">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                VIEW API DOCUMENTATION
            </a>

            <!-- GitHub Repository Link -->
            <a href="https://github.com/zTe0/Ground-Track_Dashboard" target="_blank" style="color: #4fc3f7; text-decoration: none; font-size: 11px; display: flex; align-items: center; gap: 8px; font-weight: bold; letter-spacing: 1px;">
                <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="display: inline-block;">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                VIEW CODE ON GITHUB
            </a>
        </div>
    </div>
    </div>
    <div id="map"></div>
    <!-- Leaflet.js library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map centered on the equator at zoom level 2
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // State: satellite marker, ground track line, and currently selected catalog number
        let marker = null;
        let trackLine = null;
        let currentCatalog = 25544;

        // Ground station state
        let gsMarker = null;
        let visibilityCircle = null;

        // Red circle icon to represent the satellite on the map
        const satIcon = L.divIcon({
            html: '<div style="background:#ff5252;width:12px;height:12px;border-radius:50%;border:2px solid #000;"></div>',
            iconSize: [12, 12],
            className: ''
        });

                // Draw ground station marker and 10° elevation visibility footprint.
        // L.circle uses a metric radius on the Earth's surface, so at higher latitudes
        // the projected shape naturally flattens into an ellipse — correctly representing
        // that the visibility cone covers less longitude span away from the equator.
        function drawGroundStation() {
            const lat = parseFloat(document.getElementById('obs-lat').value) || 40.7128;
            const lon = parseFloat(document.getElementById('obs-lon').value) || -74.006;

            if (gsMarker)        { map.removeLayer(gsMarker); }
            if (visibilityCircle){ map.removeLayer(visibilityCircle); }

            // ~1 750 km radius approximates the horizon distance for a 10° min-elevation
            // mask looking at a LEO satellite at ~500–600 km altitude.
            visibilityCircle = L.circle([lat, lon], {
                radius:      1750000,   // metres
                color:       '#b8860b', // dark-yellow outline
                weight:      1.5,
                opacity:     0.8,
                fillColor:   '#ffd700', // yellow fill
                fillOpacity: 0.06
            }).addTo(map).bindPopup('Visibility footprint (10° elev. mask)');

            gsMarker = L.circleMarker([lat, lon], {
                radius:      6,
                color:       '#000000',
                fillColor:   '#2e5fad',
                fillOpacity: 0.9,
                weight:      2
            }).addTo(map).bindPopup('Ground Station (' + lat.toFixed(4) + ', ' + lon.toFixed(4) + ')');
        }

        // Fetch satellite list from backend and populate the dropdown
                // Fetch satellite list from backend and populate the dropdown with (NORAD ID)
        async function loadSatellites() {
            const res = await fetch('/api/satellites');
            const sats = await res.json();
            const select = document.getElementById('sat-select');
            sats.forEach(function(s) {
                const opt = document.createElement('option');
                opt.value = s.catalog_number;
                // UPDATE: Add (NORAD ID) to default options
                opt.textContent = `${s.name} [${s.catalog_number}]`;
                select.appendChild(opt);
            });
            select.value = currentCatalog;
            select.addEventListener('change', function(e) {
                currentCatalog = parseInt(e.target.value);
                updateDashboard();
            });
        }

        // Fetch current position and update marker + sidebar data
        async function updatePosition() {
            const res = await fetch('/api/satellite/' + currentCatalog);
            const data = await res.json();
            if (!data.latitude) return;
            const latLng = [data.latitude, data.longitude];
            if (marker) { marker.setLatLng(latLng); }
            else { marker = L.marker(latLng, {icon: satIcon}).addTo(map); }
            document.getElementById('lat').textContent = data.latitude.toFixed(4) + '\u00B0';
            document.getElementById('lon').textContent = data.longitude.toFixed(4) + '\u00B0';
            document.getElementById('alt').textContent = data.altitude_km.toFixed(1) + ' km';
            document.getElementById('vel').textContent = data.velocity_km_s.toFixed(2) + ' km/s';
            document.getElementById('inc').textContent = data.inclination_deg.toFixed(2) + '\u00B0';
            document.getElementById('period').textContent = data.period_minutes.toFixed(1) + ' min';
            document.getElementById('ecc').textContent = data.eccentricity.toFixed(6);
            document.getElementById('status').textContent = 'Updated: ' + new Date().toLocaleTimeString();
        }

        // Fetch ground track and draw as polyline segments split at the antimeridian
        async function updateTrack() {
            const res = await fetch('/api/satellite/' + currentCatalog + '/track');
            const data = await res.json();
            if (trackLine) { map.removeLayer(trackLine); }
            var segments = [];
            var current = [];
            data.track.forEach(function(p, i) {
                if (i > 0 && Math.abs(p.lon - data.track[i-1].lon) > 180) {
                    segments.push(current);
                    current = [];
                }
                current.push([p.lat, p.lon]);
            });
            segments.push(current);
            trackLine = L.layerGroup(segments.map(function(seg) {
                return L.polyline(seg, {color: '#4fc3f7', weight: 2, opacity: 0.7});
            })).addTo(map);
        }

        // Clear existing layers and redraw everything from scratch
        async function updateDashboard() {
            if (marker) { map.removeLayer(marker); marker = null; }
            if (trackLine) { map.removeLayer(trackLine); trackLine = null; }
            await updatePosition();
            await updateTrack();
            if (marker) { map.setView(marker.getLatLng(), 3); }
        }

                // Dynamically validate and inject a custom NORAD ID into the dashboard
                // Dynamically validate, fetch real name, and inject custom satellite
                // Dynamically validate, fetch real name, and inject custom satellite with (NORAD ID)
        async function loadCustomSatellite() {
            const input = document.getElementById('custom-sat-input');
            const catalogNum = parseInt(input.value);
            const statusDiv = document.getElementById('status');
            
            if (isNaN(catalogNum) || catalogNum <= 0) {
                alert("Please enter a valid, positive NORAD ID.");
                return;
            }
            
            statusDiv.textContent = 'Searching catalog...';
            
            try {
                // Fetch the satellite position first to validate the ID and retrieve its actual name
                const res = await fetch('/api/satellite/' + catalogNum);
                if (!res.ok) throw new Error("Satellite not found in database.");
                const data = await res.json();
                
                // Confirm we got valid orbital data and a real name
                if (!data.name || !data.latitude) {
                    throw new Error("Malformed satellite data returned.");
                }
                
                currentCatalog = catalogNum;
                const realName = data.name; // This is the real, live name!
                
                // Check if this satellite is already in the select dropdown list
                const select = document.getElementById('sat-select');
                let exists = false;
                for (let i = 0; i < select.options.length; i++) {
                    if (parseInt(select.options[i].value) === catalogNum) {
                        exists = true;
                        break;
                    }
                }
                
                // If it's a new custom satellite, dynamically inject it with real name and (NORAD ID)!
                if (!exists) {
                    const opt = document.createElement('option');
                    opt.value = catalogNum;
                    // UPDATE: Displays real name accompanied by (NORAD ID)
                    opt.textContent = `${realName} [${catalogNum}]`;
                    select.appendChild(opt);
                }
                
                // Sync UI elements and reload map layers
                select.value = catalogNum;
                input.value = ''; // Clear the input field
                
                // Update the dashboard with the new satellite
                await updateDashboard();
                
            } catch (err) {
                alert(`Could not load satellite ${catalogNum}. Please verify the NORAD ID is correct.`);
                statusDiv.textContent = 'Failed to load custom satellite.';
            }
        }

        // Event listeners for custom loading trigger
        document.getElementById('custom-sat-btn').addEventListener('click', loadCustomSatellite);
        document.getElementById('custom-sat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadCustomSatellite();
            }
        });

        async function predictPasses() {
            const lat = document.getElementById('obs-lat').value;
            const lon = document.getElementById('obs-lon').value;
            drawGroundStation(); // Refresh marker + footprint when observer coords change
            const res = await fetch('/api/satellite/' + currentCatalog + '/passes?lat=' + lat + '&lon=' + lon);
            const data = await res.json();
            const list = document.getElementById('passes-list');
            if (data.passes.length === 0) {
                list.innerHTML = '<div class="pass-item">No passes found in next 24h</div>';
                return;
            }
            list.innerHTML = data.passes.slice(0, 5).map(function(p) {
                var rise = new Date(p.rise_time).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                var set = p.set_time ? new Date(p.set_time).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '--';
                return '<div class="pass-item"><span class="pass-time">' + rise + ' - ' + set + '</span><br/>Max El: ' + p.max_elevation + '\u00B0</div>';
            }).join('');
        }

        document.getElementById('predict-btn').addEventListener('click', predictPasses);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                document.getElementById('obs-lat').value = pos.coords.latitude.toFixed(4);
                document.getElementById('obs-lon').value = pos.coords.longitude.toFixed(4);
            });
        }

                // Load the satellite list, then trigger the first full render
                loadSatellites().then(function() {
                    updateDashboard();
                    drawGroundStation();
                });
        // Re-fetch position every 5 seconds to animate the marker
        setInterval(updatePosition,1000);
    </script>
</body>
</html>
